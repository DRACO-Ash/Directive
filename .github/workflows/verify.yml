name: verify

on:
  push: {}
  pull_request:
    branches: [main]

# Least privilege. This workflow reads the repository and nothing else, and holds no
# deploy credential, because it performs no deploy.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit SHA, not a mutable major tag: a hash-locked lockfile installed
      # by an unpinned action is only as trustworthy as the action.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version-file: .python-version

      - name: Install from the hash-locked lockfiles
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt

      - name: Confirm the lockfiles are unchanged by the install
        run: git diff --exit-code -- requirements-runtime.txt requirements.txt requirements-dev.txt

      # Three POSIX scripts now carry the verification, packaging and pipeline-simulation
      # logic and nothing statically checked them. `shellcheck` may be absent from the
      # development machine, where the local loop reports an honest skip, so this runner is
      # the binding leg exactly as it is for the dependency scan. The binary comes from the
      # runner image rather than an install step; if a future image drops it, this fails on
      # a missing command, which is the right direction.
      - name: Shell
        run: shellcheck -s sh scripts/*.sh

      - name: Format
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Types
        run: python -m mypy

      # AMD-001 section 10.6 requires static application security testing on every code
      # change, and Continuous Integration is the only leg that runs on every change: the
      # local loop is voluntary. ruff and mypy are a linter and a type checker and do not
      # satisfy the clause.
      - name: Static application security testing (AMD-001 section 10.6)
        run: python -m bandit --configfile pyproject.toml --quiet --recursive src wsgi.py

      - name: Tests with coverage
        run: python -m pytest --cov --cov-report=xml --cov-report=term

      - name: Confirm the coverage artefact the quality gate reads exists
        run: test -s coverage.xml

      # This runner has network access, so an unreachable advisory service is a hard
      # failure here, never an honest skip. This job is the binding source of truth for
      # the dependency scan.
      # All three lockfiles, named for what each one is. When the files split three ways
      # these two steps kept pointing at `requirements.txt`, which had just stopped being
      # the runtime set and become the test-inclusive superset, so the file that actually
      # ships was scanned nowhere in Continuous Integration while a step still called
      # itself "(runtime)".
      - name: Dependency vulnerabilities (runtime, the tree the image installs)
        run: python -m pip_audit -r requirements-runtime.txt

      - name: Dependency vulnerabilities (test set, what the App Store installs and scans)
        run: python -m pip_audit -r requirements.txt

      - name: Dependency vulnerabilities (tooling)
        run: python -m pip_audit -r requirements-dev.txt

      # The local loop emits this and Continuous Integration did not, so the two legs
      # disagreed about what a green run means. This runner is the binding one: it has
      # network access, so a failure to generate is a hard failure rather than a skip.
      # The artefact is what distinguishes an App Store analyser crash from a genuine
      # advisory, and the Cyber Resilience Act reporting duty binds on 11 September 2026.
      #
      # Built from an INSTALL of the runtime lockfile, not from the lockfile text. Two
      # separate defects made the text route wrong. It read `requirements.txt` until the
      # lockfiles split three ways, and from that moment described a product that does not
      # exist: 15 components including pytest, against the 9 the container carries. And the
      # text route is incomplete even when pointed at the right file: `pip-audit -r` returned
      # 8 of the 9 pins, dropping `packaging` from both the audit and the inventory with no
      # skip notice, no warning and exit 0. Installing the lockfile and auditing that by path
      # returns all 9, and the assertion below fails the job if it ever does not.
      - name: Software bill of materials
        run: |
          python -m pip install --require-hashes --no-deps --target sbom-tree \
            -r requirements-runtime.txt
          python -m pip_audit --path sbom-tree --format cyclonedx-json \
            --progress-spinner off -o sbom.cdx.json
          test -s sbom.cdx.json
          python - <<'COMPLETE'
          import json, re, sys
          pins = {n.lower() for n, _ in re.findall(
              r"^[ \t]*([A-Za-z0-9_.\-]+)==([^ ;\\\n]+)",
              open("requirements-runtime.txt", encoding="utf-8").read(), re.MULTILINE)}
          listed = {c["name"].lower() for c in
                    json.load(open("sbom.cdx.json", encoding="utf-8"))["components"]}
          missing = sorted(pins - listed)
          if missing or not pins:
              sys.exit(f"the bill of materials omits {missing or 'everything'}")
          print(f"all {len(pins)} shipped pins are inventoried")
          COMPLETE
          rm -rf sbom-tree

      - name: Keep the bill of materials with the run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 90

      # The two real-permission readiness assertions are skipped when the suite runs as
      # root. This job runs as a non-root user, so they must actually execute here. The
      # check reads the JUnit report rather than matching the human-readable skip
      # reason, so rewording that reason cannot silently disarm the guard.
      - name: Confirm the real-permission readiness assertions ran
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests/test_health.py -q --junitxml=/tmp/health.xml
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          required = {
              "test_readiness_returns_503_with_the_path_and_errno_when_storage_refuses",
              "test_the_storage_probe_proves_a_write_rather_than_existence",
          }
          tree = ET.parse("/tmp/health.xml")
          seen = {}
          for case in tree.iter("testcase"):
              seen[case.get("name")] = [child.tag for child in case]
          missing = required - set(seen)
          skipped = {name for name in required & set(seen) if "skipped" in seen[name]}
          if missing or skipped:
              print(f"FAIL: missing={sorted(missing)} skipped={sorted(skipped)}")
              sys.exit(1)
          print(f"both real-permission assertions executed: {sorted(required)}")
          PY
