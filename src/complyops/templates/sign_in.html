{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block body %}
<div class="signin-wrap">
  <main class="signin" id="main">
    <h1>Compliance Operations Console</h1>
    <p class="sub">Bluestaq Limited</p>
    {% if banner %}<div class="banner" role="status">{{ banner }}</div>{% endif %}
    <form method="post" action="{{ url_for('auth.sign_in_submit') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="next" value="{{ next_path }}">
      <label for="actor">Your name or user principal name</label>
      <input id="actor" name="actor" required maxlength="200" autocomplete="username"
             placeholder="ash.higgins@bluestaq.uk">
      <button type="submit" class="primary">Sign in</button>
    </form>
  </main>
</div>
{% endblock %}
