{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block body %}
<div class="signin-wrap">
  <main class="signin" id="main">
    <h1>Directive</h1>
    <p class="sub">Bluestaq Limited</p>
    {% if banner %}<output class="banner">{{ banner }}</output>{% endif %}
    <form method="post" action="{{ url_for('auth.sign_in_submit') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="next" value="{{ next_path }}">
      <label for="username">{% if local %}Username{% else %}Your name or user principal name{% endif %}</label>
      <input id="username" name="username" required maxlength="128" autocomplete="username"
             autocapitalize="none" spellcheck="false" placeholder="ash.higgins@bluestaq.uk">
      {% if local %}
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required maxlength="1024"
             autocomplete="current-password">
      {% endif %}
      <button type="submit" class="primary">Sign in</button>
    </form>
    {% if local %}
    <p class="hint">You will be asked for a code from your authenticator app next.</p>
    {% endif %}
  </main>
</div>
{% endblock %}
