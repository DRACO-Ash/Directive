# sonar-project.properties :: SonarQube Code Quality gate scoping.
# The gate needs line coverage of at least 80%, zero open violations, and every
# security hotspot resolved or reviewed.

sonar.projectKey=comply-ops
sonar.sources=src
sonar.tests=tests
# Python coverage is Cobertura XML, produced only by the xml report.
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12
